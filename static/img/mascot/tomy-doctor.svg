<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Tomy Doctor (Maskot dengan Kaca Pembesar) -->
  <defs>
    <filter id="shadow-doc" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#2B2D42" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Tubuh Tomat Merah Bulat -->
  <circle cx="100" cy="115" r="70" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" filter="url(#shadow-doc)" />

  <!-- Daun dan Batang Kepala -->
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" />
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2EC4B6" stroke-width="4" stroke-linecap="round" />
  <path d="M 100 50 C 75 40 55 58 60 70 C 72 65 85 62 100 62 C 115 62 128 65 140 70 C 145 58 125 40 100 50 Z" 
        fill="#2EC4B6" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round" />

  <!-- Cermin Dokter Kepala (Head Mirror) -->
  <circle cx="70" cy="58" r="14" fill="#E2E8F0" stroke="#2B2D42" stroke-width="3" />
  <circle cx="70" cy="58" r="6" fill="#A0AEC0" stroke="#2B2D42" stroke-width="2" />
  <path d="M 58 64 Q 100 45 138 62" fill="none" stroke="#2B2D42" stroke-width="3" />

  <!-- Pipi Pink -->
  <circle cx="68" cy="125" r="10" fill="#FF9F9F" opacity="0.8" />
  <circle cx="132" cy="125" r="10" fill="#FF9F9F" opacity="0.8" />

  <!-- Mata Fokus Cerdas -->
  <ellipse cx="78" cy="110" rx="9" ry="11" fill="#2B2D42" />
  <circle cx="75" cy="107" r="3.5" fill="#FFFFFF" />
  <ellipse cx="122" cy="110" rx="9" ry="11" fill="#2B2D42" />
  <circle cx="119" cy="107" r="3.5" fill="#FFFFFF" />

  <!-- Mulut Semangat -->
  <path d="M 90 125 Q 100 136 110 125" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round" />

  <!-- Kaca Pembesar Dipegang di Tangan Kiri -->
  <!-- Gagang Kaca Pembesar -->
  <line x1="28" y1="160" x2="48" y2="128" stroke="#FFB703" stroke-width="8" stroke-linecap="round" />
  <line x1="28" y1="160" x2="48" y2="128" stroke="#2B2D42" stroke-width="3" stroke-linecap="round" />
  <!-- Lingkaran Kaca Pembesar -->
  <circle cx="56" cy="115" r="22" fill="#E0F2FE" fill-opacity="0.85" stroke="#2B2D42" stroke-width="5" />
  <circle cx="56" cy="115" r="16" fill="none" stroke="#BAE6FD" stroke-width="3" />
  <!-- Tangan Memegang -->
  <circle cx="48" cy="128" r="9" fill="#FF5A5F" stroke="#2B2D42" stroke-width="3" />

  <!-- Tangan Kanan Acungan Jempol -->
  <path d="M 165 115 C 180 110 185 98 178 95 C 172 93 168 108 160 118" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" />

  <!-- Kaki Mini -->
  <ellipse cx="80" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
  <ellipse cx="120" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
</svg>
