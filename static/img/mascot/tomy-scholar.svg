<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Tomy Scholar (Maskot Ensiklopedia dengan Kacamata & Buku) -->
  <defs>
    <filter id="shadow-sch" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#2B2D42" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Tubuh Tomat Merah Bulat -->
  <circle cx="100" cy="115" r="70" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" filter="url(#shadow-sch)" />

  <!-- Daun dan Batang Kepala -->
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" />
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2EC4B6" stroke-width="4" stroke-linecap="round" />
  <path d="M 100 50 C 75 40 55 58 60 70 C 72 65 85 62 100 62 C 115 62 128 65 140 70 C 145 58 125 40 100 50 Z" 
        fill="#2EC4B6" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round" />

  <!-- Kacamata Bulat Cendekiawan -->
  <!-- Lingkaran Kiri -->
  <circle cx="76" cy="108" r="17" fill="#FFFFFF" fill-opacity="0.3" stroke="#2B2D42" stroke-width="4" />
  <!-- Lingkaran Kanan -->
  <circle cx="124" cy="108" r="17" fill="#FFFFFF" fill-opacity="0.3" stroke="#2B2D42" stroke-width="4" />
  <!-- Jembatan Kacamata -->
  <path d="M 93 108 Q 100 102 107 108" fill="none" stroke="#2B2D42" stroke-width="4" />

  <!-- Mata di Balik Kacamata -->
  <circle cx="76" cy="108" r="7" fill="#2B2D42" />
  <circle cx="74" cy="106" r="2.5" fill="#FFFFFF" />
  <circle cx="124" cy="108" r="7" fill="#2B2D42" />
  <circle cx="122" cy="106" r="2.5" fill="#FFFFFF" />

  <!-- Pipi Pink -->
  <circle cx="58" cy="125" r="9" fill="#FF9F9F" opacity="0.8" />
  <circle cx="142" cy="125" r="9" fill="#FF9F9F" opacity="0.8" />

  <!-- Senyum Cerdas -->
  <path d="M 90 125 Q 100 135 110 125" fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round" />

  <!-- Buku Agronomi Terbuka di Depan Dada -->
  <path d="M 65 142 L 98 147 L 98 172 L 65 167 Z" fill="#FFFDF7" stroke="#2B2D42" stroke-width="3" />
  <path d="M 135 142 L 102 147 L 102 172 L 135 167 Z" fill="#FFFDF7" stroke="#2B2D42" stroke-width="3" />
  <!-- Cover Buku Hijau -->
  <path d="M 62 144 L 98 149 L 98 174 L 62 169 Z" fill="#2EC4B6" stroke="#2B2D42" stroke-width="2" />
  <path d="M 138 144 L 102 149 L 102 174 L 138 169 Z" fill="#2EC4B6" stroke="#2B2D42" stroke-width="2" />
  <!-- Logo Daun Mini di Buku -->
  <ellipse cx="80" cy="157" rx="5" ry="3" fill="#2EC4B6" />
  <ellipse cx="120" cy="157" rx="5" ry="3" fill="#2EC4B6" />

  <!-- Kaki Mini -->
  <ellipse cx="80" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
  <ellipse cx="120" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
</svg>
