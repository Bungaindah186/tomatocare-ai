<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Tomy Camera (Maskot Deteksi Real-Time) -->
  <defs>
    <filter id="shadow-cam" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#2B2D42" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Tubuh Tomat Merah Bulat -->
  <circle cx="100" cy="115" r="70" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" filter="url(#shadow-cam)" />

  <!-- Daun dan Batang Kepala -->
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" />
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2EC4B6" stroke-width="4" stroke-linecap="round" />
  <path d="M 100 50 C 75 40 55 58 60 70 C 72 65 85 62 100 62 C 115 62 128 65 140 70 C 145 58 125 40 100 50 Z" 
        fill="#2EC4B6" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round" />

  <!-- Pipi Pink -->
  <circle cx="68" cy="125" r="10" fill="#FF9F9F" opacity="0.8" />
  <circle cx="132" cy="125" r="10" fill="#FF9F9F" opacity="0.8" />

  <!-- Mata Berkedip Satu (Wink) Ceria -->
  <!-- Mata Kiri Terbuka Lebar -->
  <ellipse cx="78" cy="108" rx="9" ry="12" fill="#2B2D42" />
  <circle cx="75" cy="104" r="4" fill="#FFFFFF" />
  <!-- Mata Kanan Wink ^_^ -->
  <path d="M 115 110 Q 124 100 133 110" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round" />

  <!-- Senyum -->
  <path d="M 88 124 Q 100 136 112 124" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round" />

  <!-- Kamera Foto Playful Menggantung di Leher / Depan Dada -->
  <rect x="75" y="132" width="50" height="34" rx="8" fill="#FFB703" stroke="#2B2D42" stroke-width="3.5" />
  <!-- Lensa Kamera -->
  <circle cx="100" cy="149" r="12" fill="#2B2D42" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="100" cy="149" r="6" fill="#2EC4B6" />
  <circle cx="98" cy="147" r="2" fill="#FFFFFF" />
  <!-- Flash & Tombol Shutter -->
  <rect x="110" y="128" width="8" height="5" rx="2" fill="#FF5A5F" stroke="#2B2D42" stroke-width="2" />
  <circle cx="83" cy="139" r="3" fill="#E2E8F0" stroke="#2B2D42" stroke-width="1.5" />

  <!-- Tali Kamera -->
  <path d="M 60 115 Q 75 135 78 138" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-dasharray="3,2" />
  <path d="M 140 115 Q 125 135 122 138" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-dasharray="3,2" />

  <!-- Kaki Mini -->
  <ellipse cx="80" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
  <ellipse cx="120" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
</svg>
