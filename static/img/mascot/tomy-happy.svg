<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Tomy Happy (Maskot Tomat Ceria) -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#2B2D42" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Tubuh Tomat Merah Bulat -->
  <circle cx="100" cy="115" r="70" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Highlight Kilau 2D -->
  <path d="M 65 80 A 45 45 0 0 1 125 70" fill="none" stroke="#FFA4A7" stroke-width="6" stroke-linecap="round" />

  <!-- Daun dan Batang Hijau di Kepala -->
  <!-- Batang -->
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" />
  <path d="M 100 48 Q 95 30 115 25" fill="none" stroke="#2EC4B6" stroke-width="4" stroke-linecap="round" />
  
  <!-- Kelopak Daun Mahkota -->
  <path d="M 100 50 C 75 40 55 58 60 70 C 72 65 85 62 100 62 C 115 62 128 65 140 70 C 145 58 125 40 100 50 Z" 
        fill="#2EC4B6" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round" />
  <path d="M 100 50 C 90 35 105 32 100 50 Z" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />

  <!-- Pipi Merona Pink (Blush) -->
  <circle cx="68" cy="125" r="11" fill="#FF9F9F" opacity="0.8" />
  <circle cx="132" cy="125" r="11" fill="#FF9F9F" opacity="0.8" />

  <!-- Mata Tomy Ceria -->
  <!-- Mata Kiri -->
  <ellipse cx="78" cy="110" rx="9" ry="12" fill="#2B2D42" />
  <circle cx="75" cy="106" r="4" fill="#FFFFFF" />
  <circle cx="81" cy="114" r="1.5" fill="#FFFFFF" />

  <!-- Mata Kanan -->
  <ellipse cx="122" cy="110" rx="9" ry="12" fill="#2B2D42" />
  <circle cx="119" cy="106" r="4" fill="#FFFFFF" />
  <circle cx="125" cy="114" r="1.5" fill="#FFFFFF" />

  <!-- Senyum Lebar & Lidah -->
  <path d="M 86 122 Q 100 142 114 122 Z" fill="#991B1B" stroke="#2B2D42" stroke-width="3" />
  <path d="M 92 130 Q 100 137 108 130" fill="#FF9F9F" />

  <!-- Tangan Melambai Lucu -->
  <!-- Tangan Kiri Melambai -->
  <path d="M 35 105 Q 20 85 28 75 C 36 68 45 88 40 115" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" />
  <!-- Tangan Kanan -->
  <path d="M 165 115 Q 180 125 175 135 C 168 142 155 128 160 110" fill="#FF5A5F" stroke="#2B2D42" stroke-width="4" />

  <!-- Kaki Tomat Mini -->
  <ellipse cx="80" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
  <ellipse cx="120" cy="182" rx="14" ry="7" fill="#2EC4B6" stroke="#2B2D42" stroke-width="3" />
</svg>
